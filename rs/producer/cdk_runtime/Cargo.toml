[package]
name = "event_store_producer_cdk_runtime"
version.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
event_store_canister.path = "../../canister/api"
event_store_producer.path = ".."
ic-cdk.workspace = true
ic-cdk-timers.workspace = true
ic_principal.workspace = true
# `std_rng` alone avoids getrandom, which refuses to build for wasm32-unknown-unknown. On wasm the
# rng is seeded from the canister id + time; only the off-wasm `random()` needs `thread_rng`.
rand = { workspace = true, default-features = false, features = ["std_rng"] }
serde.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = { workspace = true, features = ["std_rng", "thread_rng"] }